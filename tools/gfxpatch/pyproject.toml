[project]
name = "gfxpatch"
version = "0.1.0"
description = "Offline RSChordDisplay action-tag patcher for user-supplied GFX movies"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
gfxpatch = "gfxpatch:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["gfxpatch.py", "extension.as"]
